# ─────────────────────────────────────────────────────────────────────────────
# prod-wasmish-main  →  app.wasmish.com   (CRM WhatsApp — Node + React)
#   · wasmish.solventyc.com: solo /api (webhook de Meta y API pública); el resto
#     redirige a app.wasmish.com · wasmish.com y www no pasan por aquí: los sirve
#     Cloudflare (la página pública, en Site/)
# Patrón copiado de prod-dashboard-solventyc:
#   · web (nginx) sirve el SPA Y hace de reverse-proxy de /api → api
#   · api (Node) NO se expone a Traefik; solo lo ve la web por la red interna
#   · Mongo NO se despliega aquí: se usa el compartido prod-mongo-main-db-ct
#     (la api se une a prod-mongo-main-internal-net para alcanzarlo por nombre)
# Layout esperado en el server (/opt/docker-projects/prod-wasmish-main/):
#   compose.yml · .env (build args VITE_*) · config/api.env · app/{Backend,Frontend}
# Secretos en ./config/api.env (env_file, NUNCA en git ni en la imagen).
# ─────────────────────────────────────────────────────────────────────────────
name: prod-wasmish-main

volumes:
  media:
    name: prod-wasmish-main-media          # adjuntos de WhatsApp descargados

networks:
  internal-net:
    name: prod-wasmish-main-internal-net
    external: false
  proxy-net:
    name: prod-traefik-proxy-net
    external: true
  mongo-net:
    name: prod-mongo-main-internal-net       # red del Mongo compartido (ya existe)
    external: true

services:
  wasmish-api:
    build:
      context: ./app/Backend
      dockerfile: Dockerfile
    image: prod-wasmish-main-api:local
    container_name: prod-wasmish-main-api-ct
    hostname: prod-wasmish-main-api
    restart: unless-stopped
    security_opt: [no-new-privileges]
    # Sin esto Docker usa json-file sin límite y el log crece hasta llenar el
    # disco — el mismo disco donde vive el Mongo compartido de los demás
    # proyectos. Con 3 archivos de 10 MB, el techo por contenedor es 30 MB y
    # siempre quedan los últimos para diagnosticar.
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    env_file:
      - ./config/api.env                      # secretos reales (MONGO_URI, TOKEN_SECRET, META_*)
    volumes:
      - media:/app/media                      # adjuntos: fuera de la imagen, sobreviven al rebuild
    networks: [internal-net, mongo-net]       # internal-net: la ve la web · mongo-net: alcanza el Mongo

  wasmish-web:
    build:
      context: ./app/Frontend
      dockerfile: Dockerfile
      args:
        VITE_META_APP_ID: ${VITE_META_APP_ID}
        VITE_META_CONFIG_ID: ${VITE_META_CONFIG_ID}
        VITE_META_GRAPH_VERSION: ${VITE_META_GRAPH_VERSION}
    image: prod-wasmish-main-web:local
    container_name: prod-wasmish-main-web-ct
    hostname: prod-wasmish-main-web
    restart: unless-stopped
    security_opt: [no-new-privileges]
    # Sin esto Docker usa json-file sin límite y el log crece hasta llenar el
    # disco — el mismo disco donde vive el Mongo compartido de los demás
    # proyectos. Con 3 archivos de 10 MB, el techo por contenedor es 30 MB y
    # siempre quedan los últimos para diagnosticar.
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    depends_on: [wasmish-api]
    networks: [internal-net, proxy-net]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=prod-traefik-proxy-net"
      - "traefik.http.services.prod-wasmish-main.loadbalancer.server.port=80"
      # http → redirige a https, en los cuatro dominios
      - "traefik.http.routers.prod-wasmish-main-http.entrypoints=web"
      - "traefik.http.routers.prod-wasmish-main-http.rule=Host(`app.wasmish.com`) || Host(`wasmish.solventyc.com`)"
      - "traefik.http.routers.prod-wasmish-main-http.middlewares=prod-wasmish-main-redir"
      - "traefik.http.routers.prod-wasmish-main-http.service=noop@internal"
      - "traefik.http.middlewares.prod-wasmish-main-redir.redirectscheme.scheme=https"
      - "traefik.http.middlewares.prod-wasmish-main-redir.redirectscheme.permanent=true"
      # https + cert Let's Encrypt (httpChallenge, resolver "letsencrypt"). Un
      # router por dominio: cada uno pide su propio certificado, y si uno falla
      # (el DNS aún no apunta aquí) los demás siguen sirviendo.
      # La app: app.wasmish.com
      - "traefik.http.routers.prod-wasmish-main-app.entrypoints=websecure"
      - "traefik.http.routers.prod-wasmish-main-app.rule=Host(`app.wasmish.com`)"
      - "traefik.http.routers.prod-wasmish-main-app.tls=true"
      - "traefik.http.routers.prod-wasmish-main-app.tls.certresolver=letsencrypt"
      - "traefik.http.routers.prod-wasmish-main-app.service=prod-wasmish-main"
      # El dominio anterior sigue sirviendo /api sin fecha de fin: ahí apuntan el
      # webhook de Meta y la API pública del cliente real, y un POST redirigido no
      # llega (muchos clientes no lo siguen o lo convierten en GET). Lo demás va a
      # la misma ruta en app.wasmish.com. La prioridad decide entre los dos.
      - "traefik.http.routers.prod-wasmish-main-secure.entrypoints=websecure"
      - "traefik.http.routers.prod-wasmish-main-secure.rule=Host(`wasmish.solventyc.com`) && PathPrefix(`/api/`)"
      - "traefik.http.routers.prod-wasmish-main-secure.priority=20"
      - "traefik.http.routers.prod-wasmish-main-secure.tls=true"
      - "traefik.http.routers.prod-wasmish-main-secure.tls.certresolver=letsencrypt"
      - "traefik.http.routers.prod-wasmish-main-secure.service=prod-wasmish-main"
      - "traefik.http.routers.prod-wasmish-main-legacy.entrypoints=websecure"
      - "traefik.http.routers.prod-wasmish-main-legacy.rule=Host(`wasmish.solventyc.com`)"
      - "traefik.http.routers.prod-wasmish-main-legacy.priority=10"
      - "traefik.http.routers.prod-wasmish-main-legacy.tls=true"
      - "traefik.http.routers.prod-wasmish-main-legacy.tls.certresolver=letsencrypt"
      - "traefik.http.routers.prod-wasmish-main-legacy.middlewares=prod-wasmish-main-to-app"
      - "traefik.http.routers.prod-wasmish-main-legacy.service=noop@internal"
      - "traefik.http.middlewares.prod-wasmish-main-to-app.redirectregex.regex=^https?://wasmish\\.solventyc\\.com(:[0-9]+)?/(.*)"
      - "traefik.http.middlewares.prod-wasmish-main-to-app.redirectregex.replacement=https://app.wasmish.com/$${2}"
      - "traefik.http.middlewares.prod-wasmish-main-to-app.redirectregex.permanent=true"
