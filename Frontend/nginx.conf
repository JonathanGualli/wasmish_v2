# nginx del front wasmish — SPA (React + Vite) + reverse-proxy de /api → api.
# TLS lo termina Traefik; aquí solo HTTP interno en :80.
# Patrón calcado de prod-dashboard-solventyc, con soporte SSE para /api/stream.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cache largo para assets con hash de Vite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API → contenedor Node. Conserva el prefijo /api (el backend monta en /api).
    location /api/ {
        proxy_pass http://prod-wasmish-main-api-ct:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE (/api/stream): sin buffer, sin cache, conexión larga
        proxy_set_header Connection        '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;

        client_max_body_size 10M;
    }

    # SPA: cualquier ruta desconocida → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
