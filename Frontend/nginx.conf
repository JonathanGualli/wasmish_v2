# nginx del front wasmish — SPA (React + Vite) + reverse-proxy de /api → api.
# TLS lo termina Traefik; aquí solo HTTP interno en :80.
# Patrón calcado de prod-dashboard-solventyc, con soporte SSE para /api/stream.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cache largo para assets con hash de Vite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # App instalable (PWA): el service worker y el manifest, SIN caché. El
    # navegador compara sw.js para saber si hay versión nueva; con caché, el
    # celular se quedaría con el viejo después de un despliegue.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # La página de la app, SIN caché: sin cabecera, el navegador la reutilizaba
    # un rato por su cuenta (heurística) y, tras un despliegue, el celular podía
    # seguir con la versión anterior. Pregunta siempre; si no cambió, es un 304.
    # La cubre también el `try_files` de abajo (cualquier ruta de la SPA).
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # API → contenedor Node. Conserva el prefijo /api (el backend monta en /api).
    location /api/ {
        proxy_pass http://prod-wasmish-main-api-ct:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE (/api/stream): sin buffer, sin cache, conexión larga
        proxy_set_header Connection        '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;

        # 20 MB: el archivo de la cabecera de una plantilla llega hasta 16 MB.
        client_max_body_size 20M;
    }

    # SPA: cualquier ruta desconocida → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
