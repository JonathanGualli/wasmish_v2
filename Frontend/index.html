<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
  <link rel="apple-touch-icon" href="/brand/apple-touch-icon-180.png" />
  <!-- App instalable (PWA): nombre, íconos y cómo se abre. En iPhone, las dos
       meta de Apple hacen que se abra a pantalla completa desde el ícono. -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Wasmish" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Verde profundo de marca — la barra del navegador en móvil hace juego con el sidebar -->
  <meta name="theme-color" content="#0b3b2e" />
  <title>Wasmish — CRM de WhatsApp Business</title>

  <!-- Tipografía de marca: Inter para el sistema, JetBrains Mono solo para datos -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet" />
</head>

<body>
  <div id="root"></div>
  <div id="notice"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
